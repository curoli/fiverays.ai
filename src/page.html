<!doctype html>
<html lang="{{language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="{{path}}">
  <title>{{title}} · Five Rays AI</title>
  <link rel="icon" type="image/svg+xml" href="/assets/five-rays-ai-logo.svg">
  <script>
    if (["ar", "ur"].includes(document.documentElement.lang)) {
      document.documentElement.dir = "rtl";
    }
  </script>
  <style>
    :root {
      color-scheme: light;
      --paper: #fffef8;
      --ink: #191925;
      --blue: #2020a2;
      --line: #d9d8ce;
      --yellow: #ffed00;
      font-family: system-ui, sans-serif;
      line-height: 1.65;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    a { color: var(--blue); text-underline-offset: .22em; }
    a:hover { text-decoration-thickness: .15em; }
    a:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }
    .wrap { width: min(100% - 2.5rem, 68rem); margin-inline: auto; }
    header { border-block: .4rem solid var(--yellow); border-bottom-width: 0; }
    .masthead {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem 2rem;
      align-items: center;
      justify-content: space-between;
      padding-block: 1.2rem;
      border-bottom: 1px solid var(--line);
    }

    .brand { display: inline-flex; align-items: center; }
    .brand img { width: 5rem; height: auto; }
    .menus, nav { display: flex; flex-wrap: wrap; align-items: center; gap: .55rem 1.25rem; }
    nav a { font-weight: 600; }
    .languages { position: relative; }
    .languages summary {
      cursor: pointer;
      border: 1px solid var(--line);
      border-radius: .35rem;
      padding: .4rem .65rem;
    }
    .languages summary:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }
    .languages nav {
      margin-block-start: .3rem;
      display: grid;
      gap: 0;
      max-block-size: min(60vh, 24rem);
      overflow: auto;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: .35rem;
      box-shadow: 0 .3rem 1rem #19192522;
    }
    @media (min-width: 50rem) {
      .languages nav {
        position: absolute;
        z-index: 1;
        inset-inline-end: 0;
        min-inline-size: max-content;
      }
    }
    .languages nav a:not([hreflang]) { display: none; }
    .languages nav a { padding: .4rem .75rem; text-align: start; }
    .languages nav a:focus-visible { outline-offset: -3px; }
    .languages nav a[aria-current] { color: var(--ink); background: #ffed0033; }
    :root:lang(ar) :is(h1, h2), :root:lang(ur) :is(h1, h2) { letter-spacing: normal; }

    main { padding-block: clamp(2.5rem, 7vw, 6rem); min-block-size: 65vh; }
    h1, h2 { line-height: 1.08; text-wrap: balance; }
    h1 {
      font-size: clamp(2.5rem, 8vw, 5.5rem);
      letter-spacing: -.065em;
      max-width: 16ch;
      margin: 0 0 1.4rem;
    }

    h2 {
      font-size: clamp(1.5rem, 4vw, 2rem);
      letter-spacing: -.025em;
      margin: 2rem 0 .7rem;
      border-top: 1px solid var(--line);
      padding-top: 1rem;
      max-width: 48rem;
    }

    p, ul { margin: 0 0 1rem; max-width: 65ch; }
    main img { max-inline-size: 100%; block-size: auto; }
    main :is(h1, h2) img[src="/assets/sanqi/app-icon.svg"] {
      inline-size: 1em;
      aspect-ratio: 1;
      margin-inline-start: .3em;
      vertical-align: -.1em;
      border-radius: .15em;
    }
    main img[src="/assets/oliver.jpg"] {
      inline-size: min(100%, 24rem);
      aspect-ratio: auto 3 / 4;
    }
    main p strong:first-child { font-size: clamp(1.2rem, 3vw, 1.6rem); }
    footer { border-top: 1px solid var(--line); padding-block: 1.4rem 2rem; }
    footer .wrap { display: flex; flex-wrap: wrap; gap: .6rem 1.25rem; }
  </style>
</head>
<body>
  <header>
    <div class="wrap masthead">
      <a class="brand" href="/{{language}}/" aria-label="Five Rays AI">
        <img src="/assets/five-rays-ai-logo.svg" width="100" height="88" alt="">
      </a>
      <div class="menus">
        <nav>
          <a href="/{{language}}/projects/" data-label="projects">Projects</a>
          <a href="/{{language}}/news/" data-label="news">News</a>
          <a href="/{{language}}/about/" data-label="about">About</a>
          <a href="/{{language}}/privacy/" data-label="privacy">Privacy notice</a>
        </nav>
        <details class="languages">
          <summary>Language</summary>
          <nav>{{navigation}}</nav>
        </details>
      </div>
    </div>
  </header>
  <main class="wrap">{{content}}</main>
  <footer>
    <div class="wrap">
      <span>Five Rays AI</span>
      <span><span data-label="poweredBy">Powered by</span> <a href="/{{language}}/projects/ryllis.html">Ryllis</a></span>
    </div>
  </footer>
  <script>
    // Use the same flags and language names as the Sanqi app.
    const languages = {
      en: ["🇬🇧", "English", "Language", "Projects", "News", "Privacy notice", "Powered by", "About"],
      de: ["🇩🇪", "Deutsch", "Sprache", "Projekte", "Aktuelles", "Datenschutzerklärung", "Erstellt mit", "Über uns"],
      id: ["🇮🇩", "Bahasa Indonesia", "Bahasa", "Proyek", "Berita", "Pemberitahuan privasi", "Dibuat dengan", "Tentang kami"],
      ar: ["🇸🇦", "العربية", "اللغة", "المشاريع", "الأخبار", "إشعار الخصوصية", "أُنشئ باستخدام", "نبذة عنا"],
      zh: ["🇨🇳", "中文", "语言", "项目", "新闻", "隐私声明", "构建工具", "关于我们"],
      es: ["🇪🇸", "Español", "Idioma", "Proyectos", "Noticias", "Aviso de privacidad", "Creado con", "Acerca de"],
      tr: ["🇹🇷", "Türkçe", "Dil", "Projeler", "Haberler", "Gizlilik bildirimi", "Kullanılan araç", "Hakkımızda"],
      hi: ["🇮🇳", "हिन्दी", "भाषा", "परियोजनाएँ", "समाचार", "गोपनीयता सूचना", "इसके साथ बनाया गया:", "हमारे बारे में"],
      fr: ["🇫🇷", "Français", "Langue", "Projets", "Actualités", "Politique de confidentialité", "Créé avec", "À propos"],
      bn: ["🇧🇩", "বাংলা", "ভাষা", "প্রকল্প", "সংবাদ", "গোপনীয়তা বিজ্ঞপ্তি", "সাইট তৈরির টুল:", "আমাদের সম্পর্কে"],
      pt: ["🇵🇹", "Português", "Idioma", "Projetos", "Notícias", "Aviso de privacidade", "Criado com", "Sobre nós"],
      ur: ["🇵🇰", "اردو", "زبان", "منصوبے", "خبریں", "رازداری کا نوٹس", "سائٹ بنانے کا ٹول:", "ہمارے بارے میں"],
      ru: ["🇷🇺", "Русский", "Язык", "Проекты", "Новости", "Уведомление о конфиденциальности", "Создано с помощью", "О нас"],
      ja: ["🇯🇵", "日本語", "言語", "プロジェクト", "ニュース", "プライバシー通知", "サイト生成ツール", "私たちについて"]
    };

    const [flag, name, languageLabel, projects, news, privacy, poweredBy, about] =
      languages[document.documentElement.lang] ?? languages.en;
    const labels = { projects, news, privacy, poweredBy, about };
    for (const element of document.querySelectorAll("[data-label]")) {
      element.textContent = labels[element.dataset.label];
    }

    const dropdown = document.querySelector(".languages");
    const summary = dropdown.querySelector("summary");
    const options = dropdown.querySelector("nav");
    summary.textContent = flag + " " + name;
    summary.setAttribute("aria-label", languageLabel + " · " + name);
    options.setAttribute("aria-label", languageLabel);
    for (const link of options.querySelectorAll("a[hreflang]")) {
      const locale = languages[link.hreflang];
      if (!locale) continue;
      const [optionFlag, optionName] = locale;
      const icon = document.createElement("span");
      icon.setAttribute("aria-hidden", "true");
      icon.textContent = optionFlag;
      link.dir = "auto";
      link.replaceChildren(icon, " " + optionName);
    }
    dropdown.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && dropdown.open) {
        dropdown.open = false;
        summary.focus();
      }
    });
    document.addEventListener("click", (event) => {
      if (!dropdown.contains(event.target)) dropdown.open = false;
    });
  </script>
</body>
</html>
